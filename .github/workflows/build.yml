name: Build TOEIC Master APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APK
        run: find . -name "*.apk" -type f

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"
          keytool -genkey -v -keystore toeic.jks \
            -alias toeic -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TOEICMaster,OU=App,O=TOEIC,L=HN,S=HN,C=VN" \
            -storepass toeic123 -keypass toeic123 -noprompt
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks toeic.jks --ks-key-alias toeic \
            --ks-pass pass:toeic123 --key-pass pass:toeic123 \
            --out toeic-master.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          echo "APK signed successfully"
          ls -lh toeic-master.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOEIC-Master-APK
          path: toeic-master.apk
          retention-days: 30
